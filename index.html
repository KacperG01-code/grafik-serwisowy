<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grafik Serwisu</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
</head>
<body>

  <header>
    <h1>Mój Grafik</h1>
    <button id="exportBtn" class="btn btn-green">Pobierz Excel</button>
  </header>

  <div class="main-content">
    <!-- Formularz dodawania dyżuru -->
    <div class="panel form-panel">
      <h2>Dodaj wpis</h2>
      <select id="projectSelect">
        <option value="co2ol">COOL TECHNIK (Stawki Zmienne)</option>
        <option value="backoffice">BackOffice (Pn-Pt, godziny dzienne)</option>
      </select>
      
      <label>Rozpoczęcie:</label>
      <input type="datetime-local" id="timeStart" value="2026-08-05T00:00">
      
      <label>Zakończenie:</label>
      <input type="datetime-local" id="timeEnd">

      <div style="margin-top: 10px;">
        <input type="checkbox" id="isHoliday"> 
        <label for="isHoliday" style="display:inline;">Zaznacz, jeśli to Święto (Niedziele liczą się automatycznie)</label>
      </div>

      <button id="addShiftBtn" class="btn btn-blue">Zapisz godziny</button>
    </div>

    <!-- Lista wpisów -->
    <div class="panel list-panel">
      <h2>Twoje dyżury</h2>
      <div id="shiftsList" class="schedule-container">
        <!-- Tutaj JavaScript będzie generował kafelki -->
      </div>
    </div>
  </div>

  <script src="js/calculator.js"></script>
  <script src="js/excel-gen.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
